<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雾港 · 自定义地图工坊</title>
<style>
:root{--ink:#e8efe6;--muted:#9fb0a2;--lime:#d6ed91;--panel:#13211cf2;--line:#4a5c49}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e1a17;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#0b1613;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;letter-spacing:.08em;color:var(--lime)}
.tabs{display:flex;gap:8px;margin-left:auto}
.tabs button,.toolbar button,.palette button,.dialog button{background:#1d2f26;color:var(--ink);border:1px solid #55684f;padding:7px 13px;border-radius:6px;font-size:13px;cursor:pointer}
.tabs button.active{background:var(--lime);color:#15211a;border-color:var(--lime);font-weight:600}
main{flex:1;position:relative;display:flex;min-height:0}
#page-make,#page-play{position:absolute;inset:0;display:none}
#page-make.active,#page-play.active{display:flex}
#sidebar{width:212px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
#sidebar h3{font-size:12px;color:var(--muted);margin:6px 0 0;text-transform:uppercase;letter-spacing:.07em}
#palette{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#palette button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;font-size:11px;line-height:1.2}
#palette button .ic{font-size:17px}
#palette button.selected{background:var(--lime);color:#15211a;border-color:var(--lime)}
#tools{display:flex;flex-wrap:wrap;gap:6px}
#tools button{padding:6px 9px;font-size:12px}
#tools button.selected{background:#3a542b;border-color:var(--lime);color:var(--lime)}
#canvasWrap{flex:1;position:relative;background:#0a1411;min-width:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);background:#0b1613cc;padding:6px 10px;border-radius:6px;pointer-events:none;max-width:70%}
#status{position:absolute;right:12px;top:10px;font-size:12px;background:#0b1613dd;padding:6px 10px;border-radius:6px;border:1px solid var(--line);max-width:60%}
#status.err{border-color:#e96961;color:#ffb3a0}
#status.ok{border-color:var(--lime);color:var(--lime)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--lime);border-radius:10px;padding:18px;min-width:300px}
dialog::backdrop{background:#000a}
dialog label{display:block;margin:10px 0 4px;font-size:13px}
dialog input,dialog select{width:100%;padding:8px;background:#0d1815;border:1px solid #55684f;color:var(--ink);border-radius:6px}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.mapList{display:grid;gap:8px;padding:14px;overflow:auto;width:100%}
.mapCard{display:flex;align-items:center;gap:12px;background:#16261f;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.mapCard .info{flex:1;min-width:0}
.mapCard b{font-size:14px}
.mapCard small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.mapCard button{padding:6px 11px;font-size:12px}
.empty{padding:40px;text-align:center;color:var(--muted);margin:auto}
.toolbar{padding:6px 10px;border-top:1px solid var(--line);background:#0b1613;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .spacer{flex:1}
.badge{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🗺️ 自定义地图工坊</h1>
    <span id="mapTitle" class="badge"></span>
    <div class="tabs">
      <button id="tabMake" class="active">🎨 制作地图</button>
      <button id="tabPlay">▶️ 体验已制作地图</button>
    </div>
  </header>

  <main>
    <!-- 制作地图 -->
    <section id="page-make" class="active">
      <aside id="sidebar">
        <h3>组件</h3>
        <div id="palette"></div>
        <h3>工具</h3>
        <div id="tools">
          <button data-tool="brush" class="selected">🖌️ 放置</button>
          <button data-tool="erase">🧽 擦除</button>
          <button data-tool="rect">⬛ 矩形</button>
          <button data-tool="pan">✋ 平移</button>
          <button id="orientBtn" title="旋转朝向 (R)">↔️ 朝向:横</button>
        </div>
        <h3>操作</h3>
        <div id="tools2">
          <button id="undoBtn">↶ 撤销</button>
          <button id="redoBtn">↷ 重做</button>
          <button id="outlineBtn">生成庄园外墙轮廓</button>
          <button id="clearBtn">清空地图</button>
        </div>
      </aside>
      <div id="canvasWrap">
        <canvas id="editorCanvas"></canvas>
        <div id="status"></div>
        <div class="hint">左键放置 · 右键/擦除工具删除 · 滚轮缩放 · 空格/中键拖动平移 · R 旋转朝向 · Ctrl+Z 撤销</div>
      </div>
    </section>

    <!-- 体验已制作地图 -->
    <section id="page-play">
      <div id="canvasWrap" style="width:100%">
        <canvas id="playCanvas"></canvas>
        <div id="playStatus"></div>
        <div class="hint">WASD / 方向键移动 · 走到密码机(黄)/板子(橙)/窗(蓝)/大门(绿)/椅子(红)/地窖(青) 附近查看 · 撞墙自动阻挡</div>
      </div>
    </section>
  </main>

  <div class="toolbar" id="toolbarMake">
    <button id="newMapBtn">＋ 新建空地图</button>
    <button id="saveLocalBtn">💾 保存到本地</button>
    <button id="exportBtn">⬇️ 导出 .fogmap.json</button>
    <button id="importBtn">⬆️ 导入地图</button>
    <input type="file" id="importFile" accept=".json,.fogmap,application/json" hidden>
    <button id="validateBtn">✅ 校验地图</button>
    <span class="spacer"></span>
    <span id="counts" class="badge"></span>
  </div>
</div>

<!-- runtime -->
<script type="module">
import {
  TILES, GRID_PRESETS, createEmptyMap, normalizeMap, serializeMap, deserializeMap, validateMap,
  canPlace, placeTile, removeAt, tileAt, structureAt, cellTypeAt, inBounds,
  listMapsLocal, saveMapLocal, loadMapLocal, deleteMapLocal, downloadMap, readMapFile, mapToWorld
} from './map-editor.js';

// ---------------------------------------------------------------- state
let map = createEmptyMap('我的新地图', 'medium');
let currentTool = 'brush';
let selectedType = 'wall';
let orient = 'h';
let history = [], future = [];
const statusEl = document.getElementById('status');
const editorCanvas = document.getElementById('editorCanvas');
const ectx = editorCanvas.getContext('2d');
const playCanvas = document.getElementById('playCanvas');
const pctx = playCanvas.getContext('2d');

// ---------------------------------------------------------------- helpers
function snapshot() { return JSON.stringify({ tiles: map.tiles, structures: map.structures }); }
function pushHistory() { history.push(snapshot()); if (history.length > 100) history.shift(); future.length = 0; }
function restore(json) { const d = JSON.parse(json); map.tiles = d.tiles; map.structures = d.structures; }
function undo() { if (!history.length) return; future.push(snapshot()); restore(history.pop()); render(); }
function redo() { if (!future.length) return; history.push(snapshot()); restore(future.pop()); render(); }
function toast(msg, ok = false) { statusEl.textContent = msg; statusEl.className = ok ? 'ok' : 'err'; clearTimeout(toast._t); toast._t = setTimeout(() => { statusEl.textContent = ''; statusEl.className = ''; }, 2600); }
function updateCounts() {
  const c = (t) => map.tiles.filter(x => x.type === t).length;
  document.getElementById('counts').textContent =
    `尺寸 ${map.size.cols}×${map.size.rows} · 墙 ${c('wall')} · 外${c('manorWall')} · 机 ${c('cipher')} · 椅 ${c('chair')} · 门 ${c('exit')} · 窗 ${c('window')} · 板 ${c('pallet')} · 建筑 ${map.structures.length}`;
  document.getElementById('mapTitle').textContent = `${map.name}（${GRID_PRESETS[map.size.key]?.label || map.size.cols + '×' + map.size.rows}）`;
}

// ---------------------------------------------------------------- palette
const paletteEl = document.getElementById('palette');
for (const [type, def] of Object.entries(TILES)) {
  const b = document.createElement('button');
  b.dataset.type = type;
  b.title = def.hint || def.label;
  b.innerHTML = `<span class="ic">${def.icon}</span><span>${def.label}</span>`;
  b.onclick = () => { selectedType = type; currentTool = 'brush'; setTool('brush'); highlightPalette(); };
  paletteEl.appendChild(b);
}
function highlightPalette() { paletteEl.querySelectorAll('button').forEach(b => b.classList.toggle('selected', b.dataset.type === selectedType)); }
highlightPalette();

const toolsEl = document.getElementById('tools');
function setTool(tool) {
  currentTool = tool;
  toolsEl.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('selected', b.dataset.tool === tool));
}
toolsEl.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
const orientBtn = document.getElementById('orientBtn');
function setOrient(o) { orient = o; orientBtn.textContent = `↔️ 朝向:${o === 'h' ? '横' : '竖'}`; }
orientBtn.onclick = () => setOrient(orient === 'h' ? 'v' : 'h');
document.getElementById('undoBtn').onclick = undo;
document.getElementById('redoBtn').onclick = redo;
document.getElementById('clearBtn').onclick = () => { if (confirm('确定清空当前地图？')) { pushHistory(); map.tiles = []; map.structures = []; render(); } };
document.getElementById('outlineBtn').onclick = () => {
  pushHistory();
  const { cols, rows } = map.size;
  for (let x = 0; x < cols; x++) { for (const y of [0, rows - 1]) { removeAt(map, x, y); placeTile(map, 'manorWall', x, y); } }
  for (let y = 0; y < rows; y++) { for (const x of [0, cols - 1]) { removeAt(map, x, y); placeTile(map, 'manorWall', x, y); } }
  toast('已生成庄园外墙轮廓，逃生门只能放在它上面', true);
  render();
};

// ---------------------------------------------------------------- editor render
let cam = { ox: 0, oy: 0, scale: 1 };
function fitView() {
  const w = editorCanvas.clientWidth, h = editorCanvas.clientHeight;
  const pad = 40;
  const s = Math.min((w - pad * 2) / map.size.cols, (h - pad * 2) / map.size.rows);
  cam.scale = s; cam.ox = (w - map.size.cols * s) / 2; cam.oy = (h - map.size.rows * s) / 2;
}
function cellFromEvent(e) {
  const r = editorCanvas.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  return { x: Math.floor((px - cam.ox) / cam.scale), y: Math.floor((py - cam.oy) / cam.scale) };
}
function colorOf(type) { return TILES[type]?.color || '#888'; }

function render() {
  editorCanvas.width = editorCanvas.clientWidth * devicePixelRatio;
  editorCanvas.height = editorCanvas.clientHeight * devicePixelRatio;
  ectx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ectx.fillStyle = '#0a1411'; ectx.fillRect(0, 0, editorCanvas.clientWidth, editorCanvas.clientHeight);
  const s = cam.scale;
  // grid background
  for (let y = 0; y < map.size.rows; y++) for (let x = 0; x < map.size.cols; x++) {
    ectx.fillStyle = (x + y) % 2 ? '#0f1e19' : '#0d1a16';
    ectx.fillRect(cam.ox + x * s, cam.oy + y * s, s, s);
  }
  // structures
  for (const st of map.structures) {
    const [fw, fh] = TILES[st.type].footprint;
    ectx.fillStyle = colorOf(st.type); ectx.globalAlpha = 0.75;
    ectx.fillRect(cam.ox + st.x * s, cam.oy + st.y * s, fw * s, fh * s);
    ectx.globalAlpha = 1;
    ectx.strokeStyle = '#0008'; ectx.strokeRect(cam.ox + st.x * s, cam.oy + st.y * s, fw * s, fh * s);
    ectx.fillStyle = '#fff'; ectx.font = `${Math.max(11, s * 1.2)}px sans-serif`; ectx.textAlign = 'center'; ectx.textBaseline = 'middle';
    ectx.fillText(TILES[st.type].icon, cam.ox + (st.x + fw / 2) * s, cam.oy + (st.y + fh / 2) * s);
  }
  // tiles (draw walls first so markers show above)
  const order = ['wall', 'manorWall', 'rock', 'tree', 'obstacle', 'pallet', 'window', 'cipher', 'chair', 'hatch', 'exit'];
  for (const t of order) {
    for (const tile of map.tiles) {
      if (tile.type !== t) continue;
      const cx = cam.ox + tile.x * s, cy = cam.oy + tile.y * s;
      ectx.fillStyle = colorOf(tile.type); ectx.globalAlpha = tile.type === 'window' || tile.type === 'exit' ? 0.9 : 0.85;
      ectx.fillRect(cx + 1, cy + 1, s - 2, s - 2); ectx.globalAlpha = 1;
      ectx.fillStyle = '#0b1412'; ectx.font = `${Math.max(10, s * 1.1)}px sans-serif`; ectx.textAlign = 'center'; ectx.textBaseline = 'middle';
      ectx.fillText(TILES[tile.type].icon, cx + s / 2, cy + s / 2);
    }
  }
  // grid lines
  ectx.strokeStyle = '#ffffff10'; ectx.lineWidth = 1;
  for (let x = 0; x <= map.size.cols; x++) { ectx.beginPath(); ectx.moveTo(cam.ox + x * s, cam.oy); ectx.lineTo(cam.ox + x * s, cam.oy + map.size.rows * s); ectx.stroke(); }
  for (let y = 0; y <= map.size.rows; y++) { ectx.beginPath(); ectx.moveTo(cam.ox, cam.oy + y * s); ectx.lineTo(cam.ox + map.size.cols * s, cam.oy + y * s); ectx.stroke(); }
  // hover preview
  if (hover.x >= 0) {
    ectx.strokeStyle = '#d6ed91'; ectx.lineWidth = 2; ectx.strokeRect(cam.ox + hover.x * s, cam.oy + hover.y * s, s, s);
  }
  updateCounts();
}

// ---------------------------------------------------------------- editor input
let hover = { x: -1, y: -1 }, painting = false, panning = false, panStart = null, rectStart = null;
editorCanvas.addEventListener('contextmenu', e => e.preventDefault());
editorCanvas.addEventListener('pointerdown', e => {
  editorCanvas.setPointerCapture(e.pointerId);
  const c = cellFromEvent(e); hover = c;
  const isPan = currentTool === 'pan' || e.button === 1 || spaceDown;
  if (isPan) { panning = true; panStart = { x: e.clientX - cam.ox, y: e.clientY - cam.oy }; return; }
  if (!inBounds(map, c.x, c.y) && currentTool !== 'rect') return;
  if (currentTool === 'rect') { rectStart = c; painting = true; return; }
  pushHistory(); applyAt(c, e.button === 2);
  painting = true;
});
editorCanvas.addEventListener('pointermove', e => {
  const c = cellFromEvent(e); hover = c;
  if (panning) { cam.ox = e.clientX - panStart.x; cam.oy = e.clientY - panStart.y; render(); return; }
  if (painting && currentTool !== 'rect') { applyAt(c, e.buttons === 2); render(); return; }
  render();
});
window.addEventListener('pointerup', e => {
  if (painting && currentTool === 'rect' && rectStart) {
    const c = cellFromEvent(e);
    pushHistory();
    const x0 = Math.min(rectStart.x, c.x), x1 = Math.max(rectStart.x, c.x);
    const y0 = Math.min(rectStart.y, c.y), y1 = Math.max(rectStart.y, c.y);
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) placeTile(map, selectedType, x, y, orient);
    rectStart = null;
  }
  painting = false; panning = false;
  render();
});
editorCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  const r = editorCanvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const wx = (mx - cam.ox) / cam.scale, wy = (my - cam.oy) / cam.scale;
  cam.scale = Math.max(8, Math.min(80, cam.scale * (e.deltaY < 0 ? 1.12 : 0.89)));
  cam.ox = mx - wx * cam.scale; cam.oy = my - wy * cam.scale; render();
}, { passive: false });

function applyAt(c, erase) {
  if (!inBounds(map, c.x, c.y)) return;
  if (erase || currentTool === 'erase') { removeAt(map, c.x, c.y); return; }
  const res = placeTile(map, selectedType, c.x, c.y, orient);
  if (!res.ok) toast(`✖ ${res.reason}`);
}
let spaceDown = false;
window.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.code === 'Space') spaceDown = true;
  if (e.key === 'r' || e.key === 'R') setOrient(orient === 'h' ? 'v' : 'h');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; });

// ---------------------------------------------------------------- toolbar
document.getElementById('newMapBtn').onclick = () => newMapDialog();
document.getElementById('saveLocalBtn').onclick = () => {
  const v = validateMap(map);
  saveMapLocal(map);
  toast(v.valid ? '✔ 已保存到本地地图库' : '✔ 已保存（存在校验警告）', true);
  refreshLibrary();
};
document.getElementById('exportBtn').onclick = () => { downloadMap(map); toast('⬇️ 已导出地图文件', true); };
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  try { map = await readMapFile(file); history = []; future = []; fitView(); render(); toast('✔ 已导入地图：' + map.name, true); }
  catch (err) { toast('✖ ' + err.message); }
  e.target.value = '';
};
document.getElementById('validateBtn').onclick = () => {
  const v = validateMap(map);
  if (v.valid) toast('✔ 校验通过' + (v.warnings.length ? '（' + v.warnings.length + ' 条提示）' : ''), true);
  else toast('✖ ' + v.errors.slice(0, 2).join('；'));
  if (v.warnings.length) console.warn('地图校验提示', v.warnings);
};

function newMapDialog() {
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `<h3 style="margin:0 0 4px">新建空地图</h3>
    <label>地图名称</label><input id="mName" value="我的新地图" maxlength="24">
    <label>地图尺寸</label>
    <select id="mSize"><option value="small">小 15×15</option><option value="medium" selected>中 35×35</option><option value="large">大 50×50</option></select>
    <div class="row"><button id="cancel">取消</button><button id="ok" style="background:#d6ed91;color:#15211a">创建空地图</button></div>`;
  document.body.appendChild(dlg); dlg.showModal();
  dlg.querySelector('#cancel').onclick = () => dlg.close();
  dlg.querySelector('#ok').onclick = () => {
    map = createEmptyMap(dlg.querySelector('#mName').value, dlg.querySelector('#mSize').value);
    history = []; future = []; fitView(); render(); dlg.close(); dlg.remove();
    toast('✔ 已创建空地图', true);
  };
  dlg.addEventListener('close', () => dlg.remove());
}

// ---------------------------------------------------------------- library (体验)
const library = { el: null };
function refreshLibrary() {
  const root = document.getElementById('playList') || library.el;
  if (!root) return;
  const maps = listMapsLocal();
  root.innerHTML = '';
  if (!maps.length) { root.innerHTML = '<div class="empty">还没有保存的地图，先到「制作地图」里创作并保存吧</div>'; return; }
  for (const m of maps) {
    const row = document.createElement('div');
    row.className = 'mapCard';
    row.innerHTML = `<div class="info"><b>${m.name}</b><small>${GRID_PRESETS[m.size?.key]?.label || (m.size?.cols + '×' + m.size?.rows)} · 组件 ${m.tiles} · 建筑 ${m.structures} · 更新 ${new Date(m.updatedAt).toLocaleString()}</small></div>`;
    const play = document.createElement('button'); play.textContent = '▶️ 进入3D对局'; play.style.background = '#d6ed91'; play.style.color = '#15211a';
    play.onclick = () => {
      const full = loadMapLocal(m.id); if (!full) return;
      try { localStorage.setItem('fogbound-pending-map', serializeMap(full)); } catch (e) { alert('无法保存地图到本地存储'); return; }
      location.href = 'index.html';
    };
    const preview = document.createElement('button'); preview.textContent = '🔍 预览';
    preview.onclick = () => startPlay(m.id);
    const edit = document.createElement('button'); edit.textContent = '✏️ 编辑';
    edit.onclick = () => { const full = loadMapLocal(m.id); if (full) { map = full; history = []; future = []; switchTab('make'); fitView(); render(); } };
    const del = document.createElement('button'); del.textContent = '🗑️';
    del.onclick = () => { if (confirm('删除地图 ' + m.name + '？')) { deleteMapLocal(m.id); refreshLibrary(); } };
    const exp = document.createElement('button'); exp.textContent = '⬇️';
    exp.onclick = () => downloadMap(loadMapLocal(m.id));
    row.append(play, preview, edit, exp, del);
    root.appendChild(row);
  }
}

function switchTab(which) {
  document.getElementById('tabMake').classList.toggle('active', which === 'make');
  document.getElementById('tabPlay').classList.toggle('active', which === 'play');
  document.getElementById('page-make').classList.toggle('active', which === 'make');
  document.getElementById('page-play').classList.toggle('active', which === 'play');
  document.getElementById('toolbarMake').style.display = which === 'make' ? 'flex' : 'none';
  if (which === 'make') { ensureResize(); render(); } else { refreshLibrary(); ensureResize(); }
}
document.getElementById('tabMake').onclick = () => switchTab('make');
document.getElementById('tabPlay').onclick = () => switchTab('play');

// ---------------------------------------------------------------- playable preview
const play = { map: null, world: null, player: { x: 0, y: 0 }, keys: {}, last: 0, cell: 0 };
function startPlay(id) {
  const m = loadMapLocal(id); if (!m) return;
  play.map = m; play.world = mapToWorld(m);
  play.cell = play.world.cell;
  const world = play.world;
  play.player = { x: 1.5, y: world.size.h / 2 / play.cell };
  document.getElementById('playStatus').textContent = `正在体验：${m.name}（尺寸 ${m.size.cols}×${m.size.rows}）`;
  ensureResize();
  play.last = performance.now();
  requestAnimationFrame(playLoop);
}
function solidAt(cx, cy) {
  const m = play.map;
  if (cx < 0 || cy < 0 || cx >= m.size.cols || cy >= m.size.rows) return true;
  const st = structureAt(m, cx, cy);
  if (st) {
    // buildings are solid on their perimeter; allow walking inside via door gap (approx: solid)
    return true;
  }
  const t = cellTypeAt(m, cx, cy);
  return ['wall', 'manorWall', 'rock', 'tree', 'obstacle'].includes(t);
}
function playLoop(now) {
  if (!play.map) return;
  const dt = Math.min(0.05, (now - play.last) / 1000); play.last = now;
  let dx = 0, dy = 0;
  if (play.keys['w'] || play.keys['arrowup']) dy -= 1;
  if (play.keys['s'] || play.keys['arrowdown']) dy += 1;
  if (play.keys['a'] || play.keys['arrowleft']) dx -= 1;
  if (play.keys['d'] || play.keys['arrowright']) dx += 1;
  const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
  const speed = 6; // cells per second
  const nx = play.player.x + dx * speed * dt, ny = play.player.y + dy * speed * dt;
  const rad = 0.3;
  if (!solidAt(Math.floor(nx + Math.sign(dx) * rad), Math.floor(play.player.y))) play.player.x = nx;
  if (!solidAt(Math.floor(play.player.x), Math.floor(ny + Math.sign(dy) * rad))) play.player.y = ny;
  drawPlay();
  requestAnimationFrame(playLoop);
}
function drawPlay() {
  const w = playCanvas.clientWidth, h = playCanvas.clientHeight;
  playCanvas.width = w * devicePixelRatio; playCanvas.height = h * devicePixelRatio;
  pctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  pctx.fillStyle = '#0a1411'; pctx.fillRect(0, 0, w, h);
  const m = play.map, s = Math.min(w / m.size.cols, h / m.size.rows);
  const ox = (w - m.size.cols * s) / 2, oy = (h - m.size.rows * s) / 2;
  const px = (c) => ox + c * s, py = (r) => oy + r * s;
  for (const st of m.structures) {
    const [fw, fh] = TILES[st.type].footprint;
    pctx.fillStyle = colorOf(st.type); pctx.globalAlpha = .7; pctx.fillRect(px(st.x), py(st.y), fw * s, fh * s); pctx.globalAlpha = 1;
    pctx.strokeStyle = '#000a'; pctx.strokeRect(px(st.x), py(st.y), fw * s, fh * s);
  }
  for (const t of m.tiles) {
    pctx.fillStyle = colorOf(t.type); pctx.globalAlpha = .85;
    pctx.fillRect(px(t.x) + 1, py(t.y) + 1, s - 2, s - 2); pctx.globalAlpha = 1;
  }
  // entities from world (generators/chairs/hatch/exits)
  const dot = (wx, wy, col, r = 4) => { pctx.fillStyle = col; pctx.beginPath(); pctx.arc(ox + (wx / play.cell) * s, oy + (wy / play.cell) * s, r, 0, 7); pctx.fill(); };
  play.world.generators.forEach(g => dot(g.x, g.y, '#ffd23f'));
  play.world.chairs.forEach(c => dot(c.x, c.y, '#e25a3c'));
  play.world.hatchLocations.forEach(c => dot(c.x, c.y, '#4fd6c9'));
  play.world.exits.forEach(c => dot(c.x, c.y, '#48c96e', 6));
  // player
  pctx.fillStyle = '#d6ed91';
  pctx.beginPath(); pctx.arc(px(play.player.x), py(play.player.y), Math.max(5, s * 0.32), 0, 7); pctx.fill();
  // nearest label
  let best = null, bd = 1e9;
  const all = [
    ...play.world.generators.map(o => ({ ...o, label: '密码机' })),
    ...play.world.chairs.map(o => ({ ...o, label: '狂欢之椅' })),
    ...play.world.hatchLocations.map(o => ({ ...o, label: '地窖' })),
    ...play.world.exits.map(o => ({ ...o, label: '逃生门' }))
  ];
  for (const o of all) { const d = Math.hypot(o.x / play.cell - play.player.x, o.y / play.cell - play.player.y); if (d < bd) { bd = d; best = o; } }
  if (best && bd < 3) document.getElementById('playStatus').textContent = `附近：${best.label}（${bd.toFixed(1)} 格）`;
}
window.addEventListener('keydown', e => { play.keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { play.keys[e.key.toLowerCase()] = false; });

// ---------------------------------------------------------------- resize
function ensureResize() {
  if (document.getElementById('page-make').classList.contains('active')) render();
  if (document.getElementById('page-play').classList.contains('active') && play.map) drawPlay();
}
window.addEventListener('resize', () => { fitView(); ensureResize(); });

// inject play list container
const playList = document.createElement('div');
playList.id = 'playList'; playList.className = 'mapList';
document.getElementById('page-play').appendChild(playList);
library.el = playList;

// boot
window.addEventListener('load', () => { fitView(); render(); });
setTimeout(() => { fitView(); render(); }, 0);
</script>
