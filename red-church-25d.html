<style>

:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050807;color:var(--paper);font-family:'Noto Serif SC',serif;user-select:none}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* 顶部古典庄园铭牌 */
.id5-top-bar{position:absolute;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
.brand-frame{background:linear-gradient(135deg,#1c1613ee,#0f1513f5);border:2px solid var(--border);border-image:linear-gradient(to bottom right,#8b7348,#3a2d1e) 1;padding:8px 16px;box-shadow:0 8px 30px #000c,inset 0 0 15px #00000088;position:relative}
.brand-frame::before{content:'';position:absolute;inset:2px;border:1px solid #735f3b44;pointer-events:none}
.brand-title{margin:0;font-size:15px;font-weight:700;letter-spacing:.16em;color:var(--gold);font-family:'Cinzel','Noto Serif SC',serif;display:flex;align-items:center;gap:8px}
.brand-title span{font-size:11px;color:#9b8c73;font-family:'Noto Serif SC',serif}
.zone-ribbon{margin-top:4px;font-size:11px;color:#f0e4cb;background:#2d2116;border-left:3px solid var(--gold);padding:2px 8px;display:inline-block;letter-spacing:.08em}

/* 圆形暗黑回声雷达 */
.radar-box{position:relative;pointer-events:auto;background:radial-gradient(circle,#161e1b,#0a0f0d);border:2px solid #57462b;border-radius:50%;padding:4px;box-shadow:0 8px 30px #000c}
#minimap{width:140px;height:140px;display:block;border-radius:50%;background:#0d1412}
.radar-tag{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--gold);white-space:nowrap;letter-spacing:.05em}

/* 底部状态提示条 */
.id5-bottom-bar{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:10}
.legend-scroll{background:#111614f0;border:1px solid #443722;padding:6px 12px;font-size:10px;line-height:1.7;color:#c9c0b1;pointer-events:auto;border-radius:4px;max-width:440px}
.legend-scroll b{color:var(--gold);margin-right:6px}
.legend-tag{display:inline-flex;align-items:center;margin-right:8px;white-space:nowrap}
.legend-tag i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}

.prompt-card{background:linear-gradient(to top,#191310ee,#101614ee);border:1px solid #78603b;padding:8px 14px;font-size:11px;color:var(--gold-glow);pointer-events:auto;text-align:right}
.prompt-card kbd{background:#2a1f16;border:1px solid #7a633b;padding:1px 5px;font-family:monospace;color:var(--gold);margin:0 2px}

/* 手机轮盘与交互动作键 */
.touch-controls{display:none;position:absolute;inset:0;pointer-events:none;z-index:20}
#joystick{position:absolute;left:max(25px,env(safe-area-inset-left));bottom:max(25px,env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;border:2px solid #635035;background:radial-gradient(circle,#1a262177,#0d1512aa);pointer-events:auto;touch-action:none}
#joystick-knob{position:absolute;left:38px;top:38px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#c29f5b,#735422);border:2px solid #f3d79e;box-shadow:0 0 12px #d8be7c66}
.action-cluster{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(25px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;pointer-events:auto}
.btn-action{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle,#281c15,#131a17);border:2px solid var(--gold);color:var(--gold);font-family:inherit;font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 6px 20px #000c;letter-spacing:.05em}
.btn-action:active{transform:scale(.92);background:#422a18}

@media(pointer:coarse){.touch-controls{display:block}.legend-scroll{max-width:270px;font-size:9px}}
</style>

// 危墙群 (精巧微薄化，厚度仅0.7，更符合可推倒脆墙质感)

  // 大推危墙

  { id:'dw6', x:12, y:172, w:0.7, d:14, h:3.4, down:false },
  { id:'dw7', x:26, y:180, w:14, d:0.7, h:3.4, down:false }
];

// 庄园结构墙体：厚度全部细化压缩（0.7~1.0），并在转角处严密对接
const WALLS = [

// 严密碰撞判定
function isBlocked(x, y, r = 0.95, ignorePallet = null) {
  if (x < 1.5 || x > MAP_SIZE - 1.5 || y < 1.5 || y > MAP_SIZE - 1.5) return true;
  for (const w of WALLS) {
    if (Math.abs(x - w.x) < w.w / 2 + r && Math.abs(y - w.y) < w.d / 2 + r) return true;
  }
  for (const dw of DANGER_WALLS) {
    if (!dw.down && Math.abs(x - dw.x) < dw.w / 2 + r && Math.abs(y - dw.y) < dw.d / 2 + r) return true;
  }
  for (const p of PALLETS) {
    if (p !== ignorePallet && p.down) {
      // 按照板子朝向采用扁平长方形碰撞，绝非简单的圆形碰撞
      const pw = (p.dir === 'x') ? 3.4 : 0.8;
      const pd = (p.dir === 'x') ? 0.8 : 3.4;
      if (Math.abs(x - p.x) < pw / 2 + r && Math.abs(y - p.y) < pd / 2 + r) return true;
    }
  }
  for (const t of TOMBSTONES) {
    if (Math.hypot(x - t.x, y - t.y) < 0.8 + r) return true;
  }
  return false;
}

// 细分子步防穿模滑动
function resolveMove(p, dx, dy) {
  const steps = 6;
  for (let i = 0; i < steps; i++) {
    const nx = p.x + dx / steps;
    if (!isBlocked(nx, p.y)) p.x = nx;
    const ny = p.y + dy / steps;
    if (!isBlocked(p.x, ny)) p.y = ny;
  }
}

// =========================================================================
// 3. 2.5D Isometric 核心投影与真实写实渲染管线
// 严格按真实上下层与遮挡关系剔除穿模现象
// =========================================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
let viewScale = 18;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  viewScale = Math.min(W / 44, H / 34);
  if (viewScale < 13.5) viewScale = 13.5;
}
window.addEventListener('resize', resize);
resize();

function toIso(wx, wy, wz = 0) {
  const dx = wx - player.x;
  const dy = wy - player.y;
  const sx = (dx - dy) * 0.7071 * viewScale + W / 2;
  const sy = (dx + dy) * 0.36 * viewScale - wz * viewScale + H * 0.58;
  return { x: sx, y: sy };
}

// 绘制具有明暗立体与压顶挑檐的超精细纤薄墙体
function drawIsoWall(x, y, w, d, h, colors) {
  const hw = w / 2, hd = d / 2;
  const p0 = toIso(x - hw, y - hd, 0);
  const p1 = toIso(x + hw, y - hd, 0);
  const p2 = toIso(x + hw, y + hd, 0);
  const p3 = toIso(x - hw, y + hd, 0);

  const t0 = toIso(x - hw, y - hd, h);
  const t1 = toIso(x + hw, y - hd, h);
  const t2 = toIso(x + hw, y + hd, h);
  const t3 = toIso(x - hw, y + hd, h);

  // 顶面
  ctx.fillStyle = colors.top;
  ctx.beginPath();
  ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y);
  ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#1b140f'; ctx.lineWidth = 0.8; ctx.stroke();

  // 左暗面
  ctx.fillStyle = colors.left;
  ctx.beginPath();
  ctx.moveTo(p3.x, p3.y); ctx.lineTo(p2.x, p2.y);
  ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // 右侧阴影面
  ctx.fillStyle = colors.right;
  ctx.beginPath();
  ctx.moveTo(p2.x, p2.y); ctx.lineTo(p1.x, p1.y);
  ctx.lineTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y);
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

// 绘制真实带有双木柱托架与45度斜倚木板的板区
function drawRealPallet(p) {
  const isHoriz = p.dir === 'x';
  const postH = 2.6;

  // 两侧固定木立柱支架 (支撑木板在门槽之间)
  const offX = isHoriz ? 1.6 : 0;
  const offY = isHoriz ? 0 : 1.6;

  drawIsoWall(p.x - offX, p.y - offY, 0.45, 0.45, postH, { top:'#4d3621', left:'#362414', right:'#20140a' });
  drawIsoWall(p.x + offX, p.y + offY, 0.45, 0.45, postH, { top:'#4d3621', left:'#362414', right:'#20140a' });

  if (!p.down) {
    // 真实斜靠板 (带上部斜角，厚度仅0.18，靠在一侧柱上)
    const baseP = toIso(p.x - offX * 0.4, p.y - offY * 0.4, 0);
    const topP = toIso(p.x + offX * 0.6, p.y + offY * 0.6, postH * 0.85);

    ctx.fillStyle = '#7a512c';
    ctx.strokeStyle = '#2d1b0e';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(baseP.x - 3, baseP.y);
    ctx.lineTo(baseP.x + 3, baseP.y);
    ctx.lineTo(topP.x + 3, topP.y);
    ctx.lineTo(topP.x - 3, topP.y);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // 板面加固横木条
    ctx.strokeStyle = '#4a2f18'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo((baseP.x + topP.x)/2 - 2, (baseP.y + topP.y)/2);
    ctx.lineTo((baseP.x + topP.x)/2 + 2, (baseP.y + topP.y)/2);
    ctx.stroke();
  } else {
    // 已放平横卧在门槽之间的平木板 (可翻板)
    const pw = isHoriz ? 3.4 : 0.8;
    const pd = isHoriz ? 0.8 : 3.4;
    drawIsoWall(p.x, p.y, pw, pd, 0.32, { top:'#5a3a1f', left:'#3d2513', right:'#231409' });
  }
}

// =========================================================================
// 4. 输入交互管理
// =========================================================================
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if ([' ', 'e', 'enter'].includes(e.key.toLowerCase())) handleAction();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function handleAction() {
  if (player.vaulting) return;

  // 1. 翻窗交互
  for (const w of WINDOWS) {
    if (Math.hypot(player.x - w.x, player.y - w.y) < 3.8) {
      player.decoding = null;
      startVault(w.x, w.y, w.dir);
      return;
    }
  }

  // 2. 木板放板与翻板
  for (const p of PALLETS) {
    if (Math.hypot(player.x - p.x, player.y - p.y) < 3.8) {
      player.decoding = null;
      if (!p.down) {
        p.down = true; // 放板
      } else {
        startVault(p.x, p.y, p.dir, p); // 翻板 (传入当前翻越的木板以便解算安全落点)
      }
      return;
    }
  }

  // 3. 推倒危墙
  for (const dw of DANGER_WALLS) {
    if (!dw.down && Math.hypot(player.x - dw.x, player.y - dw.y) < 4.2) {
      dw.down = true;
      return;
    }
  }

  // 4. 密码机破译
  for (const c of CIPHERS) {
    if (Math.hypot(player.x - c.x, player.y - c.y) < 4.5 && !c.done) {
      player.decoding = (player.decoding === c) ? null : c;
      return;
    }
  }

  // 5. 翻箱子
  for (const c of CHESTS) {
    if (!c.opened && Math.hypot(player.x - c.x, player.y - c.y) < 3.6) {
      c.opened = true;
      return;
    }
  }
}

function startVault(tx, ty, dir, palletObj = null) {
  const fromX = player.x, fromY = player.y;
  let toX = tx, toY = ty;

  // 沿垂直于木板/窗户轴线做大幅度跨越跨越距离提升至 2.8 米，确保完全跨出木板与柱框
  const crossOffset = 2.8;
  if (dir === 'y') {
    // 纵向通道（板横在Y轴），跨越沿X轴推进
    const sign = fromX < tx ? 1 : -1;
    toX = tx + sign * crossOffset;
    toY = ty;
  } else {
    // 横向通道（板横在X轴），跨越沿Y轴推进
    const sign = fromY < ty ? 1 : -1;
    toX = tx;
    toY = ty + sign * crossOffset;
  }

  // 智能寻找安全落点：若落点正好撞到周围死角，自动微调脱困
  if (isBlocked(toX, toY, 0.8, palletObj)) {
    for (const d of [0.5, -0.5, 1.0, -1.0]) {
      const altX = (dir === 'y') ? toX : toX + d;
      const altY = (dir === 'y') ? toY + d : toY;
      if (!isBlocked(altX, altY, 0.8, palletObj)) {
        toX = altX; toY = altY;
        break;
      }
    }
  }

  player.vaulting = { fromX, fromY, toX, toY, t: 0, palletObj };
}

// 虚拟摇杆
const joystick = document.getElementById('joystick');
const knob = document.getElementById('joystick-knob');
let touchId = null, touchDir = { x: 0, y: 0 };

joystick.addEventListener('pointerdown', e => {
  touchId = e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  calcStick(e);
});
joystick.addEventListener('pointermove', e => {
  if (touchId === e.pointerId) calcStick(e);
});
const endTouch = () => {
  touchId = null;
  touchDir = { x: 0, y: 0 };
  knob.style.transform = 'translate(0,0)';
};
joystick.addEventListener('pointerup', endTouch);
joystick.addEventListener('pointercancel', endTouch);

function calcStick(e) {
  const r = joystick.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2);
  let dy = e.clientY - (r.top + r.height / 2);
  const len = Math.hypot(dx, dy), max = 38;
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  touchDir = { x: dx / max, y: dy / max };
}

document.getElementById('btnInteract').onclick = handleAction;
document.getElementById('btnPushWall').onclick = () => {
  for (const dw of DANGER_WALLS) {
    if (!dw.down && Math.hypot(player.x - dw.x, player.y - dw.y) < 4.2) { dw.down = true; return; }
  }
};

// =========================================================================
// 5. 渲染循环 (精准深度排序 + 剔除穿模 + 纤薄哥特美学)
// =========================================================================
let lastFrameTime = performance.now();

function frame(now) {
  const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
  lastFrameTime = now;
  player.walkTimer += dt;

  // 1. 移动或翻越位移
  if (player.vaulting) {
    player.vaulting.t += dt / 0.88;
    const t = Math.min(1, player.vaulting.t);
    // 平滑缓动 (Ease-in-out)，让翻板翻窗动作在中段加速跨越
    const ease = t * t * (3 - 2 * t);
    player.x = player.vaulting.fromX + (player.vaulting.toX - player.vaulting.fromX) * ease;
    player.y = player.vaulting.fromY + (player.vaulting.toY - player.vaulting.fromY) * ease;
    if (t >= 1) {
      player.x = player.vaulting.toX;
      player.y = player.vaulting.toY;
      player.vaulting = null;
    }
  } else if (player.decoding) {
    player.decoding.p = Math.min(100, player.decoding.p + dt * 14);
    if (player.decoding.p >= 100) {
      player.decoding.done = true;
      player.decoding = null;
    }
  } else {
    let mx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0) + touchDir.x;
    let my = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0) + touchDir.y;
    const len = Math.hypot(mx, my);
    if (len > 0.05) {
      const spd = (keys['shift'] ? 24 : 16.5);
      const nx = mx / (len > 1 ? len : 1) * spd * dt;
      const ny = my / (len > 1 ? len : 1) * spd * dt;
      resolveMove(player, nx, ny);
      player.angle = Math.atan2(nx, ny);
    }
  }

  // 2. 清屏
  ctx.fillStyle = '#080d0c';
  ctx.fillRect(0, 0, W, H);

  // 地面地貌网格 (深邃哥特基调)
  for (const z of ZONES) {
    const p0 = toIso(z.box[0], z.box[1], 0);
    const p1 = toIso(z.box[2], z.box[1], 0);
    const p2 = toIso(z.box[2], z.box[3], 0);
    const p3 = toIso(z.box[0], z.box[3], 0);
    ctx.fillStyle = (z.id === 'church') ? '#1c221f' : (z.id === 'graveyard') ? '#101513' : '#121a17';
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#1a241f'; ctx.lineWidth = 1; ctx.stroke();
  }

  // 教堂中殿红地毯 (长达 36 米)
  const rc0 = toIso(98.2, 76, 0.04);
  const rc1 = toIso(101.8, 76, 0.04);
  const rc2 = toIso(101.8, 124, 0.04);
  const rc3 = toIso(98.2, 124, 0.04);
  ctx.fillStyle = '#6b1920';
  ctx.beginPath();
  ctx.moveTo(rc0.x, rc0.y); ctx.lineTo(rc1.x, rc1.y); ctx.lineTo(rc2.x, rc2.y); ctx.lineTo(rc3.x, rc3.y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#8a232c'; ctx.lineWidth = 1; ctx.stroke();

  // 地下室入口黑洞与倾斜木楼梯踏板
  for (const b of BASEMENTS) {
    const b0 = toIso(b.x - b.w / 2, b.y - b.d / 2, 0.06);
    const b1 = toIso(b.x + b.w / 2, b.y - b.d / 2, 0.06);
    const b2 = toIso(b.x + b.w / 2, b.y + b.d / 2, 0.06);
    const b3 = toIso(b.x - b.w / 2, b.y + b.d / 2, 0.06);
    ctx.fillStyle = '#010303';
    ctx.beginPath();
    ctx.moveTo(b0.x, b0.y); ctx.lineTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(b3.x, b3.y);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3d3120'; ctx.lineWidth = 1.5; ctx.stroke();
    for (let st = 1; st <= 4; st++) {
      const stepP = toIso(b.x - b.w / 2 + 1, b.y - b.d / 2 + st * 2.5, -st * 0.4);
      const stepE = toIso(b.x + b.w / 2 - 1, b.y - b.d / 2 + st * 2.5, -st * 0.4);
      ctx.strokeStyle = '#241a12'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(stepP.x, stepP.y); ctx.lineTo(stepE.x, stepE.y); ctx.stroke();
    }
  }

  // =========================================================================
  // 5. 物件深度排序渲染 (严格排序，杜绝上下层穿插混叠)
  // =========================================================================
  const drawables = [];

  for (const w of WALLS) drawables.push({ d: w.x + w.y, type:'wall', obj:w });
  for (const dw of DANGER_WALLS) drawables.push({ d: dw.x + dw.y, type:'danger_wall', obj:dw });
  for (const win of WINDOWS) drawables.push({ d: win.x + win.y, type:'window', obj:win });
  for (const p of PALLETS) drawables.push({ d: p.x + p.y, type:'pallet', obj:p });
  for (const h of HATCHES) drawables.push({ d: h.x + h.y, type:'hatch', obj:h });
  for (const g of EXITS) drawables.push({ d: g.x + g.y, type:'gate', obj:g });
  for (const c of CIPHERS) drawables.push({ d: c.x + c.y, type:'cipher', obj:c });
  for (const box of CHESTS) drawables.push({ d: box.x + box.y, type:'chest', obj:box });
  for (const t of TOMBSTONES) drawables.push({ d: t.x + t.y, type:'tomb', obj:t });
  drawables.push({ d: player.x + player.y, type:'player' });

  drawables.sort((a, b) => a.d - b.d);

  for (const item of drawables) {
    switch (item.type) {
      case 'wall': {
        const w = item.obj;
        // 近身半透明透明度适度调节，既不穿模又能观察前方
        const dist = Math.hypot(player.x - w.x, player.y - w.y);
        ctx.globalAlpha = (dist < 7.5 && player.y < w.y) ? 0.35 : 1;

        if (w.style === 'church_wall') {
          // 圣雾礼拜堂主体：深绯红暗砖 + 纤薄立柱檐口
          drawIsoWall(w.x, w.y, w.w, w.d, w.h, { top:'#65736b', left:'#541f23', right:'#361216' });
        } else if (w.style === 'pew') {
          // 木排椅：深栗色雕花木座
          drawIsoWall(w.x, w.y, w.w, w.d, w.h, { top:'#633e21', left:'#452814', right:'#271609' });
        } else if (w.style === 'cottage') {
          // 北中小房：规整严谨暗石
          drawIsoWall(w.x, w.y, w.w, w.d, w.h, { top:'#6e7c72', left:'#47534b', right:'#2d3630' });
        } else {
          // 迷宫废墟风化石墙
          drawIsoWall(w.x, w.y, w.w, w.d, w.h, { top:'#4d5a52', left:'#323c35', right:'#1f2621' });
        }
        ctx.globalAlpha = 1;
        break;
      }

      case 'danger_wall': {
        const dw = item.obj;
        if (!dw.down) {
          // 纤薄开裂脆石危墙
          drawIsoWall(dw.x, dw.y, dw.w, dw.d, dw.h, { top:'#ab8232', left:'#78581c', right:'#4a340c' });
          const p = toIso(dw.x, dw.y, dw.h + 0.2);
          ctx.strokeStyle = '#f3ca65'; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.stroke();
        } else {
          // 推塌倒地的碎石残片 (极低矮，不再阻挡)
          drawIsoWall(dw.x, dw.y, dw.w, dw.d, 0.35, { top:'#423319', left:'#2e2310', right:'#1c1509' });
        }
        break;
      }

      case 'window': {
        const win = item.obj;
        // 纤巧石框窗体 + 翻越横木
        drawIsoWall(win.x, win.y, win.w, win.d, win.h, { top:'#3a4f5e', left:'#24343f', right:'#172228' });
        const p = toIso(win.x, win.y, win.h * 0.52);
        ctx.strokeStyle = '#6e4c2e'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(p.x - 7, p.y); ctx.lineTo(p.x + 7, p.y); ctx.stroke();
        break;
      }

      case 'pallet': {
        // 双立柱门架与真实45度斜跨靠板形态
        drawRealPallet(item.obj);
        break;
      }

      case 'cipher': {
        const c = item.obj;
        // 密码机底座
        drawIsoWall(c.x, c.y, 2.8, 2.2, 1.6, { top:'#313e39', left:'#222c28', right:'#141b18' });
        // 7.5米高耸电线杆天线
        const poleBase = toIso(c.x - 1.1, c.y - 0.7, 0);
        const poleTop = toIso(c.x - 1.1, c.y - 0.7, 7.5);
        ctx.strokeStyle = '#3d2b1b'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(poleBase.x, poleBase.y); ctx.lineTo(poleTop.x, poleTop.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(poleTop.x - 7, poleTop.y); ctx.lineTo(poleTop.x + 7, poleTop.y); ctx.stroke();
        // 顶部高亮信标球
        ctx.fillStyle = c.done ? '#45e060' : '#ffbf00';
        ctx.shadowColor = c.done ? '#45e060' : '#ffbf00';
        ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(poleTop.x, poleTop.y - 2, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        break;
      }

      case 'hatch': {
        const h = item.obj;
        // 旋转锁阀铸铁地窖
        drawIsoWall(h.x, h.y, 3.2, 3.2, 0.3, { top:'#2b2733', left:'#1c1921', right:'#110f14' });
        const p = toIso(h.x, h.y, 0.35);
        ctx.strokeStyle = '#75548d'; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.stroke();
        break;
      }

      case 'gate': {
        const g = item.obj;
        drawIsoWall(g.x, g.y, g.w, g.d, g.h, { top:'#252020', left:'#1a1515', right:'#100d0d' });
        const poleP = toIso(g.x - g.w / 2 + 0.8, g.y, 0);
        const poleT = toIso(g.x - g.w / 2 + 0.8, g.y, 3.8);
        ctx.strokeStyle = '#a33333'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(poleP.x, poleP.y); ctx.lineTo(poleT.x, poleT.y); ctx.stroke();
        break;
      }

      case 'chest': {
        const box = item.obj;
        drawIsoWall(box.x, box.y, 1.6, 1.5, 1.2, { top: box.opened ? '#362a20' : '#634730', left:'#3d2a1b', right:'#24180e' });
        break;
      }

      case 'tomb': {
        const t = item.obj;
        if (t.type === 'cross') {
          drawIsoWall(t.x, t.y, 1.2, 0.5, 2.3, { top:'#5e6763', left:'#3f4642', right:'#262c29' });
        } else {
          drawIsoWall(t.x, t.y, 1.4, 0.7, 1.6, { top:'#505854', left:'#363d39', right:'#202523' });
        }
        break;
      }

      case 'player': {
        // 求生者写实哥特比例，翻越时伴有弓身蹬越抬腿高度
        const vaultLift = player.vaulting ? Math.sin(player.vaulting.t * Math.PI) * 1.2 : 0;
        const base = toIso(player.x, player.y, vaultLift);
        ctx.fillStyle = '#00000088';
        ctx.beginPath();
        ctx.ellipse(base.x, base.y + vaultLift * 8, 8, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // 躯干
        drawIsoWall(player.x, player.y, 1.0, 1.0, 1.9 + vaultLift, { top:'#364b3b', left:'#233427', right:'#152218' });

        // 头部
        const head = toIso(player.x, player.y, 2.35 + vaultLift);
        ctx.fillStyle = '#d4c5b0';
        ctx.beginPath();
        ctx.arc(head.x, head.y, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 0.8; ctx.stroke();

        // 真实写实双眼与瞳孔（去除粗暴黑圆点纽扣）
        for (const side of [-2.4, 2.4]) {
          ctx.fillStyle = '#f2f2ee';
          ctx.beginPath(); ctx.arc(head.x + side, head.y - 0.5, 2.0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#3a2618';
          ctx.beginPath(); ctx.arc(head.x + side, head.y - 0.5, 1.1, 0, Math.PI * 2); ctx.fill();
        }

        // 状态字样反馈
        if (player.vaulting) {
          ctx.fillStyle = '#d8be7c'; ctx.font = 'bold 9px monospace';
          ctx.fillText('翻越中...', head.x - 16, head.y - 14);
        } else if (player.decoding) {
          ctx.fillStyle = '#f5c542'; ctx.font = 'bold 9px monospace';
          ctx.fillText(`破译中 ${Math.floor(player.decoding.p)}%`, head.x - 20, head.y - 14);
        }
        break;
      }
    }
  }

  // 6. 区域定位与当前地名刷新
  let currentZoneName = '荒野外围';
  for (const z of ZONES) {
    if (player.x >= z.box[0] && player.x <= z.box[2] && player.y >= z.box[1] && player.y <= z.box[3]) {
      currentZoneName = z.name;
      break;
    }
  }
  document.getElementById('zoneTag').textContent = '定位：' + currentZoneName;

  // 7. 绘制右上角圆形雷达
  renderRadar();

  requestAnimationFrame(frame);
}

// 圆形雷达绘制
const minimap = document.getElementById('minimap');
const mCtx = minimap.getContext('2d');

function renderRadar() {
  mCtx.clearRect(0, 0, 140, 140);
  const s = 140 / MAP_SIZE;

  // 建筑实墙 (深灰暗石)
  mCtx.fillStyle = '#36433b';
  for (const w of WALLS) {
    mCtx.fillRect((w.x - w.w / 2) * s, (w.y - w.d / 2) * s, w.w * s, w.d * s);
  }

  // 危墙
  mCtx.fillStyle = '#b58a36';
  for (const dw of DANGER_WALLS) {
    if (!dw.down) mCtx.fillRect((dw.x - dw.w / 2) * s, (dw.y - dw.d / 2) * s, dw.w * s, dw.d * s);
  }

  // 密码机
  for (const c of CIPHERS) {
    mCtx.fillStyle = c.done ? '#45e060' : '#f5c542';
    mCtx.beginPath(); mCtx.arc(c.x * s, c.y * s, 2.2, 0, Math.PI * 2); mCtx.fill();
  }

  // 地窖
  mCtx.fillStyle = '#9d4edd';
  for (const h of HATCHES) {
    mCtx.fillRect(h.x * s - 1.8, h.y * s - 1.8, 3.6, 3.6);
  }

  // 逃生大门
  mCtx.fillStyle = '#cc3e32';
  for (const g of EXITS) {
    mCtx.fillRect((g.x - g.w / 2) * s, (g.y - g.d / 2) * s, g.w * s, g.d * s);
  }

  // 玩家黄色小点
  mCtx.fillStyle = '#ffd15c';
  mCtx.beginPath();
  mCtx.arc(player.x * s, player.y * s, 3.2, 0, Math.PI * 2);
  mCtx.fill();
  mCtx.strokeStyle = '#000'; mCtx.lineWidth = 1; mCtx.stroke();
}

requestAnimationFrame(frame);
})();
</script>
